<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access - Daily Campaign King</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lock-container {
      max-width: 450px;
      width: 100%;
      padding: 20px;
    }
    .lock-icon {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
    }
    .admin-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .password-input {
      border-radius: 15px;
      border: 2px solid #e0e0e0;
      padding: 18px 24px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 8px;
      font-weight: 600;
    }
    .password-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }
    .unlock-btn {
      border-radius: 15px;
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      transition: all 0.3s ease;
    }
    .unlock-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .attempt-counter {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(220, 53, 69, 0.9);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="lock-container">
    <div class="admin-card">
      <div class="lock-icon">
        <i class="bi bi-shield-lock-fill" style="font-size: 4rem; color: white;"></i>
      </div>
      
      <h2 class="text-center mb-2" style="font-weight: 800; color: #1a1a1a;">Admin Access</h2>
      <p class="text-center text-muted mb-4">Enter password to continue</p>
      
      <div id="loginForm">
        <div class="mb-4">
          <input type="password" id="adminPassword" class="form-control password-input" placeholder="••••••" maxlength="6" autocomplete="off">
        </div>
        <button onclick="unlockAdmin()" class="btn unlock-btn w-100">
          <i class="bi bi-unlock-fill"></i> Unlock
        </button>
      </div>

      <div id="loadingMsg" class="text-center" style="display: none;">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">Verifying...</p>
      </div>

      <div class="text-center mt-4">
        <a href="index.html" class="text-muted" style="font-size: 0.9rem; text-decoration: none;">
          <i class="bi bi-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>

    <div class="attempt-counter" id="attemptCounter">
      <i class="bi bi-exclamation-triangle-fill"></i> <span id="attemptsLeft">5</span> attempts left
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const ADMIN_PASSWORD = '848592';
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_TIME = 300000;
    
    let attempts = parseInt(localStorage.getItem('adminAttempts') || '0');
    let lockoutTime = parseInt(localStorage.getItem('adminLockout') || '0');

    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        unlockAdmin();
      }
    });

    function unlockAdmin() {
      if (Date.now() < lockoutTime) {
        const remainingTime = Math.ceil((lockoutTime - Date.now()) / 1000 / 60);
        Swal.fire({
          icon: 'error',
          title: 'Account Locked',
          text: `Too many failed attempts. Try again in ${remainingTime} minutes.`,
          confirmButtonColor: '#dc3545'
        });
        return;
      }

      const password = document.getElementById('adminPassword').value;

      if (!password) {
        Swal.fire({
          icon: 'warning',
          title: 'Enter Password',
          text: 'Please enter the admin password',
          confirmButtonColor: '#667eea'
        });
        return;
      }

      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('loadingMsg').style.display = 'block';

      setTimeout(() => {
        if (password === ADMIN_PASSWORD) {
          localStorage.setItem('adminAuthenticated', 'true');
          localStorage.setItem('adminAuthTime', Date.now().toString());
          localStorage.removeItem('adminAttempts');
          localStorage.removeItem('adminLockout');
          
          Swal.fire({
            icon: 'success',
            title: 'Access Granted',
            text: 'Welcome, Admin!',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'admin-panel.html';
          });
        } else {
          attempts++;
          localStorage.setItem('adminAttempts', attempts.toString());
          
          if (attempts >= MAX_ATTEMPTS) {
            lockoutTime = Date.now() + LOCKOUT_TIME;
            localStorage.setItem('adminLockout', lockoutTime.toString());
            
            Swal.fire({
              icon: 'error',
              title: 'Access Denied',
              text: 'Too many failed attempts. Account locked for 5 minutes.',
              confirmButtonColor: '#dc3545'
            });
            
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loadingMsg').style.display = 'none';
          } else {
            const remaining = MAX_ATTEMPTS - attempts;
            document.getElementById('attemptsLeft').textContent = remaining;
            document.getElementById('attemptCounter').style.display = 'block';
            
            Swal.fire({
              icon: 'error',
              title: 'Incorrect Password',
              text: `${remaining} attempts remaining`,
              confirmButtonColor: '#dc3545'
            });
            
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('loadingMsg').style.display = 'none';
          }
        }
      }, 800);
    }

    if (localStorage.getItem('adminAuthenticated') === 'true') {
      const authTime = parseInt(localStorage.getItem('adminAuthTime') || '0');
      if (Date.now() - authTime < 3600000) {
        window.location.href = 'admin-panel.html';
      } else {
        localStorage.removeItem('adminAuthenticated');
        localStorage.removeItem('adminAuthTime');
      }
    }

    if (attempts > 0 && attempts < MAX_ATTEMPTS) {
      const remaining = MAX_ATTEMPTS - attempts;
      document.getElementById('attemptsLeft').textContent = remaining;
      document.getElementById('attemptCounter').style.display = 'block';
    }
  </script>
</body>
</html>
